<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>听力练习 · Урок 14 · 一到十一月就冷了</title>
<style>
  :root{
    --bg:#c4dbe0;
    --bg-soft:#ddedf0;
    --panel:#eef6f8;
    --ink:#0e1a1d;
    --ink-soft:#3c545b;
    --accent:#16636d;
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;
    min-height:100dvh;padding:0 0 48px;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}
  header{padding:44px 0 24px;text-align:center}
  .kicker{font-size:14px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:8px}
  h1{font-size:30px;line-height:1.3;font-weight:700}
  .subtitle{margin-top:6px;font-size:17px;color:var(--ink-soft)}
  .card{
    display:flex;align-items:center;gap:16px;
    background:var(--panel);border-radius:var(--radius);
    padding:18px;margin-bottom:16px;
    text-decoration:none;color:var(--ink);
    transition:transform .15s ease-out,background .15s ease-out;
    min-height:56px;
  }
  .card:active{transform:scale(.98)}
  .card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .badge{
    flex:none;width:52px;height:52px;border-radius:50%;
    background:var(--ink);color:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;
  }
  .card-t{flex:1;min-width:0}
  .card-t b{display:block;font-size:19px}
  .card-t span{display:block;font-size:15px;color:var(--ink-soft);margin-top:2px}
  .arrow{flex:none;color:var(--accent);font-size:22px;font-weight:700}
  footer{text-align:center;font-size:13px;color:var(--ink-soft);padding:24px 24px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">初级听力 Ⅰ · Elementary Listening</div>
    <h1>听力练习 · Аудирование</h1>
    <div class="subtitle">第14课《一到十一月就冷了》</div>
  </header>

  <a class="card" href="14-2-4.html">
    <span class="badge">四</span>
    <span class="card-t">
      <b>课文一 · 山田佑坐出租车</b>
      <span>Выбор ответа + ответы на вопросы · 2:10</span>
    </span>
    <span class="arrow">→</span>
  </a>

  <a class="card" href="14-2-5.html">
    <span class="badge">五</span>
    <span class="card-t">
      <b>课文二 · 李美丽和山田佑对话</b>
      <span>Выбор ответа + заполнение пропусков · 2:28</span>
    </span>
    <span class="arrow">→</span>
  </a>

  <footer>Нажмите на задание, чтобы открыть его。Аудио встроено в страницу.</footer>
</div>
</body>
</html>
